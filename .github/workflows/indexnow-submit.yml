name: IndexNow changed URLs

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - '**/*.html'
      - '.github/workflows/indexnow-submit.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Submission mode'
        required: true
        default: 'all'
        type: choice
        options:
          - all

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Give GitHub Pages time to deploy
        if: github.event_name == 'push'
        shell: bash
        run: sleep 60

      - name: Verify the public IndexNow key
        shell: bash
        run: |
          set -euo pipefail
          KEY='22158cd823774663a28d9e1a866f39a7'
          KEY_URL="https://metwipe.com/${KEY}.txt"

          echo "Checking ${KEY_URL}"
          for i in {1..18}; do
            BODY="$(curl -fsSL --max-time 20 "${KEY_URL}" 2>/dev/null || true)"
            if [ "${BODY}" = "${KEY}" ]; then
              echo "IndexNow key is live and valid."
              exit 0
            fi
            echo "Attempt ${i}/18: key not available yet; waiting 10 seconds."
            sleep 10
          done

          echo "IndexNow key verification failed."
          exit 1

      - name: Build URL submission list
        id: urls
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from urllib.parse import quote

          BASE = "https://metwipe.com"
          EVENT = os.environ.get("EVENT_NAME", "")
          BEFORE = os.environ.get("BEFORE_SHA", "")
          AFTER = os.environ.get("AFTER_SHA", "")

          def sitemap_urls():
              root = ET.parse("sitemap.xml").getroot()
              ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              return [
                  node.text.strip()
                  for node in root.findall("sm:url/sm:loc", ns)
                  if node.text and node.text.strip().startswith(BASE)
              ]

          def url_for_path(path):
              path = path.strip().lstrip("./")
              if path == "index.html":
                  return BASE + "/"
              if not path.endswith(".html"):
                  return None
              return BASE + "/" + quote(path, safe="/-._~")

          submit_all = EVENT == "workflow_dispatch"

          changed = []
          if EVENT == "push" and BEFORE and AFTER and BEFORE != "0" * 40:
              diff = subprocess.check_output(
                  ["git", "diff", "--name-status", BEFORE, AFTER],
                  text=True,
              )
              for raw in diff.splitlines():
                  parts = raw.split("\t")
                  if not parts:
                      continue
                  status = parts[0]
                  names = parts[1:]
                  if status.startswith("R") and len(names) >= 2:
                      changed.extend(names[:2])
                  elif names:
                      changed.append(names[-1])

              if ".github/workflows/indexnow-submit.yml" in changed:
                  # First run after installing/upgrading this automation seeds
                  # the current canonical sitemap once.
                  submit_all = True

          if submit_all:
              urls = sitemap_urls()
              source = "current sitemap"
          else:
              urls = []
              for path in changed:
                  url = url_for_path(path)
                  if url:
                      urls.append(url)
              source = "changed HTML files"

          urls = list(dict.fromkeys(urls))
          if len(urls) > 10000:
              raise SystemExit("IndexNow accepts at most 10,000 URLs per POST.")

          with open("urls.json", "w", encoding="utf-8") as fh:
              json.dump(urls, fh, ensure_ascii=False, indent=2)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"count={len(urls)}\n")

          print(f"Prepared {len(urls)} URL(s) from {source}.")
          for url in urls:
              print(url)
          PY

      - name: Submit URLs to IndexNow
        if: steps.urls.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          KEY='22158cd823774663a28d9e1a866f39a7'

          python3 - <<'PY'
          import json

          with open("urls.json", encoding="utf-8") as fh:
              urls = json.load(fh)

          payload = {
              "host": "metwipe.com",
              "key": "22158cd823774663a28d9e1a866f39a7",
              "keyLocation": "https://metwipe.com/22158cd823774663a28d9e1a866f39a7.txt",
              "urlList": urls,
          }

          with open("indexnow-payload.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False)
          PY

          for attempt in 1 2 3; do
            HTTP_CODE="$(curl -sS -o indexnow-response.txt -w '%{http_code}' \
              --connect-timeout 20 \
              --max-time 60 \
              -H 'Content-Type: application/json; charset=utf-8' \
              -X POST \
              --data-binary @indexnow-payload.json \
              https://api.indexnow.org/IndexNow)"

            echo "IndexNow HTTP status: ${HTTP_CODE}"
            cat indexnow-response.txt || true

            if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "202" ]; then
              echo "IndexNow accepted the URL submission."
              exit 0
            fi

            if [ "${HTTP_CODE}" = "429" ] || [ "${HTTP_CODE}" -ge 500 ] 2>/dev/null; then
              echo "Temporary response; retrying after ${attempt}0 seconds."
              sleep "${attempt}0"
              continue
            fi

            echo "IndexNow rejected the submission."
            exit 1
          done

          echo "IndexNow did not accept the submission after retries."
          exit 1

      - name: No changed HTML URLs
        if: steps.urls.outputs.count == '0'
        run: echo "No changed HTML URLs to submit."
